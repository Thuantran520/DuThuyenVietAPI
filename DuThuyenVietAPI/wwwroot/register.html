<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/auth.css">
    <script>
        if (localStorage.getItem('auth_token')) { window.location.replace('/profile.html'); }
    </script>
</head>
<body>
    <div class="overlay"></div>
    <div class="auth-card">
        <div class="logo">Du Thuyền Việt</div>
        <div class="subtitle">Bắt đầu hành trình mới</div>
        <div id="alert-box"></div>
        <form id="registerForm">
            <div class="input-group">
                <label>Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên của bạn" required>
            </div>
            <div class="input-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
            </div>
            <div class="input-group">
                <label>Số điện thoại</label>
                <input type="text" id="phone" placeholder="Nhập số điện thoại" required>
            </div>
            <div class="input-group">
                <label>Địa chỉ Email</label>
                <input type="email" id="email" placeholder="Ví dụ: example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Tạo mật khẩu an toàn" required>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Đăng ký ngay</span>
                <img id="spinner" src="/images/loading.gif" style="display: none; width: 24px; height: 24px; margin: 0 auto;" alt="...">
            </button>
        </form>
        <div class="footer-link">
            Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </div>
    </div>
    <script src="js/popup.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
