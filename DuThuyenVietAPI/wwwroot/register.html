<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-card { background: var(--card-bg); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border: 1px solid var(--border-color); }
        .logo { text-align: center; font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
        .subtitle { text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-main); }
        .input-group input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; transition: border-color 0.2s; outline: none; }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; justify-content: center; align-items: center; }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
        .footer-link { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted); }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
        #alert-box { display: none; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
        .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #f87171; }
        .alert-success { background: #dcfce3; color: #15803d; border: 1px solid #4ade80; }
        .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo">Du Thuyền Việt</div>
        <div class="subtitle">Tạo tài khoản mới</div>
        <div id="alert-box"></div>
        <form id="registerForm">
            <div class="input-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Đăng ký</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>
        <div class="footer-link">
            Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </div>
    </div>
    <!-- CODE GIAO TIẾP VỚI WEB API C# -->
    <script src="js/auth.js"></script>
</body>
</html>
