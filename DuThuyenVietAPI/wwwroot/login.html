<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/auth.css">
    <script>
        if (localStorage.getItem('auth_token')) { window.location.replace('/index.html'); }
    </script>
</head>
<body>
    <div class="overlay"></div>
    <div class="auth-card">
        <div class="logo">Du Thuyền Việt</div>
        <div class="subtitle">Chào mừng bạn quay trở lại</div>
        <div id="alert-box"></div>
        <form id="loginForm">
            <div class="input-group">
                <label>Tên đăng nhập hoặc Email</label>
                <input type="text" id="usernameOrEmail" placeholder="Ví dụ: admin123 hoặc abc@gmail.com" required>
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu của bạn" required>
            </div>
            <div style="margin-bottom: 24px; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="isAdminLogin" style="width: 16px; height: 16px; cursor: pointer;">
                <label for="isAdminLogin" style="font-size: 14px; color: var(--text-main); cursor: pointer; user-select: none;">Đăng nhập hệ thống Quản lý (Admin)</label>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Đăng nhập</span>
                <img id="spinner" src="/images/loading.gif" style="display: none; width: 24px; height: 24px; margin: 0 auto;" alt="...">
            </button>
        </form>
        <div class="footer-link">
            Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
        </div>
    </div>
    <script src="js/popup.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
