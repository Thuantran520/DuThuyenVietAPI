<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Kiếm Du Thuyền - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
    <header class="main-header"></header>

    <div class="breadcrumbs-container">
        <div class="container">
            <ul class="breadcrumbs">
                <li><a href="/index.html">Trang chủ</a></li>
                <li class="active">Du thuyền</li>
            </ul>
        </div>
    </div>

    <div class="container py-5 search-layout">
        <aside class="sidebar-filter">
            <h3 class="mb-4">Lọc Kết Quả</h3>
            <form id="filterForm">
                <div class="filter-group">
                    <label>Điểm đến</label>
                    <select name="destinationId" id="filterDestination">
                        <option value="">Tất cả vịnh</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Tên du thuyền</label>
                    <input type="text" name="keyword" id="filterKeyword" placeholder="VD: Heritage, Ambassador...">
                </div>
                <div class="filter-group">
                    <label>Khoảng giá</label>
                    <select name="priceRange" id="filterPriceRange">
                        <option value="">Tất cả mức giá</option>
                        <option value="0-2000000">Dưới 2.000.000 đ</option>
                        <option value="2000000-5000000">2.000.000 đ - 5.000.000 đ</option>
                        <option value="5000000-10000000">5.000.000 đ - 10.000.000 đ</option>
                        <option value="10000000">Trên 10.000.000 đ</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Thời gian xuất phát</label>
                    <input type="date" name="departureDate" id="filterDepartureDate">
                </div>
                <button type="submit" class="btn-primary w-100">Áp dụng lọc</button>
            </form>
        </aside>
        
        <main class="search-results">
            <h2 class="section-title mb-4">Kết Quả Tìm Kiếm</h2>
            <div id="searchResultsList" class="cruise-grid">
                <!-- Data will be loaded here -->
            </div>
            <div id="pagination" class="pagination-container mt-4">
                <!-- Pagination -->
            </div>
        </main>
    </div>

    <footer class="main-footer"></footer>

    <script src="/js/popup.js"></script>
    <script src="/js/cruise.js?v=2"></script>
    <script src="/js/search-page.js"></script>
    <script src="/js/navigation.js"></script>
</body>
</html>
