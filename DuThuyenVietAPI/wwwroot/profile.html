<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .profile-card { background: var(--card-bg); border-radius: 12px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid var(--border-color); }
        
        /* Loading */
        #loader { text-align: center; padding: 20px; }
        .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #e5e7eb; border-radius: 50%; border-top-color: var(--primary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #profile-content { display: none; }
        
        /* Avatar */
        .avatar-container { text-align: center; margin-bottom: 24px; position: relative; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background-color: #e5e7eb; color: #9ca3af; display: inline-flex; justify-content: center; align-items: center; font-size: 36px; font-weight: 600; overflow: hidden; border: 2px solid var(--primary); cursor: pointer; position: relative; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .avatar:hover::after { content: "Thay ảnh"; position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: white; font-size: 11px; padding: 4px 0; text-align: center; }
        input[type="file"] { display: none; }
        
        .title { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .subtitle { text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
        
        /* Info Rows */
        .info-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .info-row:last-child { border-bottom: none; }
        .info-label { font-size: 14px; font-weight: 500; color: var(--text-muted); }
        .info-value { font-size: 14px; font-weight: 500; text-align: right; }
        
        .role-badge { background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-left: 4px; }
        
        /* Form Edit */
        .form-group { display: none; width: 100%; margin-bottom: 12px; }
        .form-group input { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; }
        
        /* Buttons */
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: white; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-outline:hover { background: #f9fafb; }
        .btn-danger { background: white; color: var(--danger); border: 1px solid #fecaca; }
        .btn-danger:hover { background: #fef2f2; }
    </style>
</head>
<body>
    <div class="profile-card">
        
        <div id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #6b7280; font-size: 14px;">Đang tải dữ liệu...</p>
        </div>

        <div id="profile-content">
            <div class="avatar-container">
                <label for="avatarUpload" class="avatar" id="avatarDisplay">
                    <span id="avatarLetter">U</span>
                    <img id="avatarImage" src="" alt="Avatar">
                </label>
                <input type="file" id="avatarUpload" accept="image/*">
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;" id="avatarStatus">Click vào ảnh để thay đổi</div>
            </div>

            <div class="title" id="val-fullname-title">Người dùng</div>
            <div class="subtitle" id="val-email-subtitle">email@domain.com</div>

            <div class="info-card">
                <div class="info-row">
                    <div class="info-label">Tên đầy đủ</div>
                    <div class="info-value">
                        <span id="val-fullname">Chưa cập nhật</span>
                        <div class="form-group" id="form-fullname">
                            <input type="text" id="input-fullname" placeholder="Nhập tên đầy đủ">
                        </div>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-label">Số điện thoại</div>
                    <div class="info-value">
                        <span id="val-phone">Chưa cập nhật</span>
                        <div class="form-group" id="form-phone">
                            <input type="text" id="input-phone" placeholder="Nhập số điện thoại">
                        </div>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-label">Quyền hạn</div>
                    <div class="info-value" id="val-roles">
                        <!-- Roles -->
                    </div>
                </div>
            </div>

            <div id="view-actions">
                <button class="btn btn-primary" id="btnEditProfile">Chỉnh sửa hồ sơ</button>
                <button class="btn btn-danger" id="btnLogout">Đăng xuất</button>
            </div>

            <div id="edit-actions" style="display: none;">
                <button class="btn btn-primary" id="btnSaveProfile">Lưu thay đổi</button>
                <button class="btn btn-outline" id="btnCancelEdit">Hủy</button>
            </div>
        </div>
    </div>
    <!-- CODE GIAO TIẾP VỚI WEB API C# -->
    <script src="js/auth.js"></script>
</body>
</html>
