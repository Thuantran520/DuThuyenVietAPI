<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Mã Giảm Giá - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/popup.css">
    <link rel="stylesheet" href="/css/promotions.css">
</head>
<body>
    <header class="main-header"></header>

    <div class="breadcrumbs-container">
        <div class="container">
            <ul class="breadcrumbs">
                <li><a href="/index.html">Trang chủ</a></li>
                <li><a href="/admin/profile.html">Admin Dashboard</a></li>
                <li class="active">Quản lý Mã Giảm Giá</li>
            </ul>
        </div>
    </div>

    <!-- STICKY TOOLBAR -->
    <div class="admin-toolbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 20px;">
                <span style="font-weight: 700; font-size: 1.25rem; color: #0f172a;">🎟️ Quản lý Mã Giảm Giá</span>
            </div>
            <button class="btn btn-primary" id="btn-add-promo">
                + Thêm Mã Khuyến Mãi
            </button>
        </div>
    </div>

    <div class="container py-5">
        <div class="promo-grid" id="promo-list">
            <!-- Loading state -->
            <div style="text-align: center; padding: 40px; color: #64748b;">Đang tải danh sách...</div>
        </div>
    </div>

    <!-- INLINE MODAL -->
    <div class="inline-modal-overlay" id="promo-modal">
        <div class="inline-modal">
            <div class="modal-title" id="modal-title">✨ Thêm Mã Giảm Giá</div>
            <input type="hidden" id="promo-id">
            
            <div class="form-row">
                <div class="form-group-modal">
                    <label class="form-label">Mã Giảm Giá (Code)</label>
                    <input type="text" id="promo-code" class="form-input" placeholder="VD: SUMMER2024" style="text-transform: uppercase; font-weight: 600; letter-spacing: 1px; color: #0f766e;">
                </div>
                <div class="form-group-modal">
                    <label class="form-label">Giảm giá (%)</label>
                    <input type="number" id="promo-discount" class="form-input" placeholder="VD: 15" min="1" max="100">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group-modal">
                    <label class="form-label">Ngày bắt đầu</label>
                    <input type="datetime-local" id="promo-start" class="form-input">
                </div>
                <div class="form-group-modal">
                    <label class="form-label">Ngày kết thúc</label>
                    <input type="datetime-local" id="promo-end" class="form-input">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group-modal" style="flex: 2;">
                    <label class="form-label">Mô tả chi tiết</label>
                    <input type="text" id="promo-desc" class="form-input" placeholder="VD: Giảm 15% cho tất cả khách hàng dịp hè...">
                </div>
                <div class="form-group-modal" style="flex: 1;">
                    <label class="form-label">Trạng thái</label>
                    <select id="promo-status" class="form-input">
                        <option value="1">Đang kích hoạt</option>
                        <option value="0">Tạm khóa</option>
                    </select>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-outline" id="btn-cancel-promo">Hủy bỏ</button>
                <button class="btn btn-primary" id="btn-save-promo">💾 Lưu Khuyến Mãi</button>
            </div>
        </div>
    </div>

    <script src="/js/popup.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/promotions.js"></script>
</body>
</html>
