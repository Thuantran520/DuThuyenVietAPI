<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
    <header class="main-header"></header>

    <section class="hero-section">
        <div class="container text-center">
            <h1>Khám Phá Vẻ Đẹp Vịnh Hạ Long</h1>
            <p>Trải nghiệm nghỉ dưỡng đẳng cấp trên những du thuyền sang trọng bậc nhất.</p>
            <form action="/search.html" method="GET" class="search-form" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                <input type="text" name="keyword" placeholder="Nhập tên du thuyền..." style="flex: 1; min-width: 150px;">
                <select name="destinationId" id="destinationSelectHome" style="flex: 1; min-width: 150px;">
                    <option value="">Tất cả vịnh</option>
                </select>
                <button type="submit" class="btn-primary" style="flex: 0 0 auto; min-width: 120px;">Tìm Kiếm</button>
            </form>
        </div>
    </section>

    <section class="top-cruises-section py-5">
        <div class="container">
            <h2 class="section-title text-center mb-4">Khám Phá Các Du Thuyền</h2>
            <div id="topCruisesList" class="cruise-grid">
                <!-- Data will be loaded here -->
            </div>
            <div id="homePagination" class="pagination-container text-center mt-4"></div>
        </div>
    </section>

    <script src="/js/cruise.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadDestinations('destinationSelectHome');
            window.loadHomeCruises(1);
        });
    </script>

    <footer class="main-footer"></footer>

    <script src="/js/lottie.min.js"></script>
    <script src="/js/effects.js"></script>
    <script src="/js/popup.js"></script>
    <script src="/js/navigation.js"></script>
</body>
</html>
