<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="/index.html" class="logo">DuThuyenViet</a>
            <nav id="topNav">
                <a href="/search.html">Tìm Du Thuyền</a>
            </nav>
        </div>
    </header>

    <section class="hero-section">
        <div class="container text-center">
            <h1>Khám Phá Vẻ Đẹp Vịnh Hạ Long</h1>
            <p>Trải nghiệm nghỉ dưỡng đẳng cấp trên những du thuyền sang trọng bậc nhất.</p>
            <form action="/search.html" method="GET" class="search-form">
                <input type="text" name="keyword" placeholder="Nhập tên du thuyền...">
                <select name="destinationId" id="destinationSelectHome">
                    <option value="">Tất cả vịnh</option>
                </select>
                <button type="submit" class="btn-primary">Tìm Kiếm</button>
            </form>
        </div>
    </section>

    <section class="top-cruises-section py-5">
        <div class="container">
            <h2 class="section-title text-center mb-4">Khám Phá Các Du Thuyền</h2>
            <div id="topCruisesList" class="cruise-grid">
                <!-- Data will be loaded here -->
            </div>
            <div id="homePagination" class="pagination-container text-center mt-4"></div>
        </div>
    </section>

    <script src="/js/cruise.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadDestinations('destinationSelectHome');
            window.loadHomeCruises(1);
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('auth_token');
            const nav = document.getElementById('topNav');
            if (nav) {
                if (token) {
                    let isAdmin = false;
                    try {
                        const jwtData = JSON.parse(atob(token.split('.')[1]));
                        const role = jwtData['http://schemas.microsoft.com/ws/2008/06/identity/claims/role'] || '';
                        if (role.includes('Admin') || role.includes('Manager') || role.includes('Staff')) {
                            isAdmin = true;
                        }
                    } catch (e) {}

                    let adminLink = '';
                    if (isAdmin) {
                        adminLink = `<a href="/admin/profile.html" style="color: #f59e0b; font-weight: 600;">Quản trị</a>`;
                    }

                    nav.innerHTML += `
                        ${adminLink}
                        <a href="/history.html">Lịch sử</a>
                        <a href="/profile.html" style="background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 600;">👤 Tài khoản</a>
                        <a href="#" id="btnLogoutBtn" style="color: #ef4444;">Đăng xuất</a>
                    `;
                    document.getElementById('btnLogoutBtn').addEventListener('click', (e) => {
                        e.preventDefault();
                        localStorage.removeItem('auth_token');
                        window.location.reload();
                    });
                } else {
                    nav.innerHTML += `
                        <a href="/login.html" style="font-weight: 600;">Đăng nhập</a>
                        <a href="/register.html" style="background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 600;">Đăng ký</a>
                    `;
                }
            }
        });
    </script>

</body>
</html>
