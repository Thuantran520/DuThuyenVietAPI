<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Đặt Vé - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/popup.css">
    <style>
        .history-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        .status-Pending { background: #fef08a; color: #854d0e; }
        .status-AwaitingConfirmation { background: #e0e7ff; color: #4338ca; }
        .status-Confirmed { background: #bbf7d0; color: #166534; }
        .status-Cancelled { background: #fecaca; color: #991b1b; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="/index.html" class="logo">DuThuyenViet</a>
            <nav id="topNav">
                <a href="/search.html">Tìm Du Thuyền</a>
            </nav>
        </div>
    </header>

    <div class="container py-5">
        <h1 class="mb-4">Lịch Sử Đặt Vé Của Bạn</h1>
        <div id="historyList">
            <p>Đang tải dữ liệu...</p>
        </div>
    </div>

    <script src="/js/popup.js"></script>
    <script>
        const API_URL = '/api';
        const getToken = () => localStorage.getItem('auth_token');
        const formatPrice = (price) => {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
        };
        const checkAuth = () => {
            if (!getToken()) {
                window.location.href = '/login.html';
                return false;
            }
            return true;
        };

        window.cancelBooking = function(id) {
            window.Popup.confirm('Xác nhận hủy', 'Bạn có chắc chắn muốn hủy đơn đặt vé này không?', async () => {
                try {
                    const res = await fetch(`${API_URL}/Bookings/${id}/Cancel`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${getToken()}` }
                    });
                    if (res.ok) {
                        window.Popup.show('Thành công', 'Hủy vé thành công', 'success');
                        initHistoryPage();
                    } else {
                        const data = await res.json();
                        window.Popup.show('Lỗi', data.message || 'Không thể hủy vé', 'error');
                    }
                } catch (e) {
                    window.Popup.show('Lỗi', 'Lỗi kết nối', 'error');
                }
            });
        };

        async function initHistoryPage() {
            if (!checkAuth()) return;

            const container = document.getElementById('historyList');
            
            try {
                const res = await fetch(`${API_URL}/Bookings/MyBookings`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                
                if (!res.ok) throw new Error('Failed to load');
                
                const data = await res.json();
                
                if (data.length === 0) {
                    container.innerHTML = '<p>Bạn chưa có lịch sử đặt vé nào.</p>';
                    return;
                }

                // Group by bookingCode
                const grouped = {};
                data.forEach(b => {
                    if (!grouped[b.bookingCode]) {
                        grouped[b.bookingCode] = { ...b, items: [], totalPrice: 0 };
                    }
                    grouped[b.bookingCode].items.push(b);
                    grouped[b.bookingCode].totalPrice += b.totalPrice;
                });

                window.copyToClipboard = function(text) {
                    navigator.clipboard.writeText(text).then(() => {
                        window.Popup.show('Đã sao chép', 'Mã thanh toán đã được lưu vào bộ nhớ tạm!', 'success');
                    });
                };

                container.innerHTML = Object.values(grouped).map(b => {
                    const isPending = b.status === 'Pending';
                    const statusText = isPending ? 'Chờ thanh toán' : (b.status === 'AwaitingConfirmation' ? 'Đang xử lý' : (b.status === 'Confirmed' ? 'Thành công' : 'Đã hủy'));
                    
                    let paymentInfo = '';
                    if (b.payments && b.payments.length > 0) {
                        const p = b.payments[0];
                        const pMethod = p.paymentMethod === 'BankTransfer' ? 'Chuyển khoản NH' : (p.paymentMethod === 'Cash' ? 'Tiền mặt' : p.paymentMethod);
                        paymentInfo = `<p class="mt-2 text-muted" style="font-size: 0.9rem;">
                            <strong>Thanh toán:</strong> ${pMethod} 
                            ${p.transactionCode ? `(Mã: ${p.transactionCode})` : ''}
                        </p>`;
                    }

                    const roomsSummary = b.items.map(i => `${i.cabinName} (x${i.numberOfRooms})`).join(', ');

                    return `
                        <div class="history-card" style="align-items: flex-start;">
                            <div style="flex: 1;">
                                <h4 class="mb-1" style="color: var(--primary);">${b.cruiseName}</h4>
                                <p class="text-muted mb-2" style="font-size: 0.9rem;">
                                    Mã đơn: <strong style="color:#0f172a; font-size:1.05rem;">${b.bookingCode}</strong> 
                                    <button onclick="copyToClipboard('${b.bookingCode}')" style="background:none; border:none; cursor:pointer; font-size:1rem; padding:0 5px;" title="Sao chép">📋</button>
                                    | Ngày tạo: ${new Date(b.createdAt).toLocaleString('vi-VN')}
                                </p>
                                
                                <div style="background: var(--bg-light); padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 0.95rem;">
                                    <p class="mb-1"><strong>Khách hàng:</strong> ${b.contactName} - ${b.contactPhone}</p>
                                    <p class="mb-1"><strong>Phòng:</strong> ${roomsSummary}</p>
                                    <p class="mb-1"><strong>Lịch đi:</strong> ${new Date(b.departureDate).toLocaleDateString('vi-VN')}</p>
                                </div>
                                
                                ${paymentInfo}
                                
                                <p class="mt-3" style="font-size: 1.1rem;"><strong>Tổng tiền: <span class="text-danger">${formatPrice(b.totalPrice)}</span></strong></p>
                            </div>
                            <div class="text-right" style="text-align: right; min-width: 150px; display: flex; flex-direction: column; align-items: flex-end;">
                                <span class="status-badge status-${b.status} mb-3" style="display: inline-block;">${statusText}</span>
                                ${isPending ? `<a href="/checkout.html?bookingId=${b.bookingId}" class="btn-primary mt-2 text-center" style="padding: 8px 15px; font-size: 14px; width: 100%; border-radius: 6px; text-decoration: none;">Thanh toán</a>` : ''}
                                ${isPending ? `<button onclick="cancelBooking(${b.bookingId})" class="btn-secondary mt-2" style="padding: 8px 15px; font-size: 14px; width: 100%; border-radius: 6px;">Hủy vé</button>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                container.innerHTML = '<p class="text-danger">Có lỗi xảy ra khi tải lịch sử.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {


            initHistoryPage();
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('auth_token');
            const nav = document.getElementById('topNav');
            if (nav) {
                if (token) {
                    nav.innerHTML += `
                        <a href="/history.html">Lịch sử</a>
                        <a href="/profile.html" style="background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 600;">👤 Tài khoản</a>
                        <a href="#" id="btnLogoutBtn" style="color: #ef4444;">Đăng xuất</a>
                    `;
                    document.getElementById('btnLogoutBtn').addEventListener('click', (e) => {
                        e.preventDefault();
                        localStorage.removeItem('auth_token');
                        window.location.reload();
                    });
                } else {
                    nav.innerHTML += `
                        <a href="/login.html" style="font-weight: 600;">Đăng nhập</a>
                        <a href="/register.html" style="background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 600;">Đăng ký</a>
                    `;
                }
            }
        });
    </script>

</body>
</html>
