<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/popup.css">
    <style>
        .checkout-box {
            max-width: 600px;
            margin: 0 auto;
            background: var(--white);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .price-total {
            font-size: 2.5rem;
            color: #ef4444;
            font-weight: 700;
            margin: 20px 0;
        }
        .payment-methods {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .payment-method {
            border: 2px solid var(--border);
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .payment-method.selected {
            border-color: var(--primary);
            background: var(--bg-light);
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="/index.html" class="logo">DuThuyenViet</a>
            <nav id="topNav">
                <a href="/search.html">Tìm Du Thuyền</a>
            </nav>
        </div>
    </header>

    <div class="container py-5">
        <div class="checkout-box">
            <h1 class="mb-2">Thanh Toán</h1>
            <p class="text-muted mb-4" id="checkoutBookingCode">Mã đơn: ...</p>
            
            <div id="checkoutDetails" class="text-left mb-4" style="text-align: left; background: var(--bg-light); padding: 20px; border-radius: 8px;">
                <!-- Info -->
            </div>
            
            <p>Tổng tiền cần thanh toán</p>
            <div class="price-total" id="checkoutTotal">0 ₫</div>
            
            <h3 class="mb-3 mt-4">Chọn phương thức thanh toán</h3>
            <div class="payment-methods" id="paymentMethods">
                <div class="payment-method selected" data-method="BankTransfer">Chuyển khoản NH</div>
                <div class="payment-method" data-method="Cash">Tiền mặt / Thu hộ</div>
            </div>
            
            <div id="paymentInstructions" class="text-left mb-4" style="text-align: left; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px dashed #cbd5e1; display: none;">
            </div>
            
            <button id="btnPay" class="btn-primary w-100" style="font-size: 1.2rem; padding: 15px;">Xác nhận</button>
        </div>
    </div>

    <script src="/js/popup.js"></script>
    <script>
        const API_URL = '/api';
        const getToken = () => localStorage.getItem('auth_token');
        const formatPrice = (price) => {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
        };
        const checkAuth = () => {
            if (!getToken()) {
                window.location.href = '/login.html';
                return false;
            }
            return true;
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const token = getToken();
            if (!checkAuth()) return;

            // Checkout page logic
            const urlParams = new URLSearchParams(window.location.search);
            const bookingCode = urlParams.get('bookingCode');
            if (!bookingCode) {
                window.location.href = '/history.html';
                return;
            }

            let selectedMethod = 'BankTransfer';
            let firstBookingId = null;

            document.querySelectorAll('.payment-method').forEach(el => {
                el.addEventListener('click', (e) => {
                    document.querySelectorAll('.payment-method').forEach(btn => btn.classList.remove('selected'));
                    e.target.classList.add('selected');
                    selectedMethod = e.target.getAttribute('data-method');
                });
            });

            try {
                const res = await fetch(`${API_URL}/Bookings/MyBookings`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) {
                    window.location.href = '/history.html';
                    return;
                }

                const allBookings = await res.json();
                const groupItems = allBookings.filter(b => b.bookingCode === bookingCode);
                
                if (groupItems.length === 0) {
                    window.location.href = '/history.html';
                    return;
                }

                const firstBooking = groupItems[0];
                firstBookingId = firstBooking.bookingId;

                if (firstBooking.status !== 'Pending') {
                    window.Popup.show('Thông báo', 'Đơn hàng này không ở trạng thái chờ thanh toán.', 'info');
                    setTimeout(() => window.location.href = '/history.html', 2000);
                    return;
                }

                const totalGroupPrice = groupItems.reduce((sum, b) => sum + b.totalPrice, 0);

                document.getElementById('checkoutBookingCode').innerText = `Mã đơn: ${bookingCode}`;
                document.getElementById('checkoutTotal').innerText = formatPrice(totalGroupPrice);
                
                const roomsDetail = groupItems.map(b => `${b.cabinName} (x${b.numberOfRooms})`).join(', ');

                // Build detailed room breakdown
                let roomDetailsHtml = groupItems.map(b => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding: 8px 0; border-bottom: 1px solid #e2e8f0;">
                        <div>
                            <span style="font-weight:600;">🛏️ ${b.cabinName}</span>
                            <span style="color:#64748b; font-size:0.9rem; margin-left:8px;">x${b.numberOfRooms} phòng</span>
                        </div>
                        <span style="font-weight:600; color:#0d9488;">${formatPrice(b.totalPrice)}</span>
                    </div>
                `).join('');

                document.getElementById('checkoutDetails').innerHTML = `
                    <p class="mb-2"><strong>🚢 Du thuyền:</strong> ${firstBooking.cruiseName}</p>
                    <p class="mb-2"><strong>📅 Ngày đi:</strong> ${new Date(firstBooking.departureDate).toLocaleDateString('vi-VN')}</p>
                    <p class="mb-3"><strong>👤 Khách hàng:</strong> ${firstBooking.contactName} — ${firstBooking.contactPhone}</p>
                    <div style="background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:12px; margin-top:8px;">
                        <div style="font-weight:700; margin-bottom:10px; color:#0f172a;">Chi tiết phòng đã đặt (${groupItems.length} loại):</div>
                        ${roomDetailsHtml}
                        <div style="display:flex; justify-content:space-between; padding-top:10px; margin-top:4px; font-size:1.05rem; font-weight:700;">
                            <span>Tổng cộng:</span>
                            <span style="color:#ef4444;">${formatPrice(totalGroupPrice)}</span>
                        </div>
                    </div>
                `;

                const updateInstructions = () => {
                    const instructions = document.getElementById('paymentInstructions');
                    instructions.style.display = 'block';
                    const btn = document.getElementById('btnPay');
                    const bCode = bookingCode;
                    const bTotal = formatPrice(totalGroupPrice);
                    
                    if (selectedMethod === 'BankTransfer') {
                        instructions.innerHTML = `
                            <h4 style="color: var(--primary); margin-bottom: 15px; font-weight: 600;">Thông tin chuyển khoản</h4>
                            <div style="display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap;">
                                <div style="flex: 1; min-width: 200px;">
                                    <p class="mb-2"><strong>Ngân hàng:</strong> Vietcombank (VCB)</p>
                                    <p class="mb-2"><strong>Chủ tài khoản:</strong> CTY TNHH DU THUYEN VIET</p>
                                    <p class="mb-2"><strong>Số tài khoản:</strong> <span style="font-size: 1.2rem; font-weight: bold; color: #ef4444;">1023456789</span></p>
                                    <p class="mb-2"><strong>Nội dung:</strong> <span style="font-weight: bold;">${bCode}</span></p>
                                    <p class="mb-2"><strong>Số tiền:</strong> <span style="font-weight: bold; color: #ef4444;">${bTotal}</span></p>
                                </div>
                                <div style="text-align: center; border: 1px solid #e2e8f0; padding: 10px; border-radius: 12px; background: white;">
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=VCB:1023456789" alt="QR Code" style="width: 150px; height: 150px;">
                                    <p style="font-size: 12px; margin-top: 8px; color: #64748b;">Quét mã QRPay</p>
                                </div>
                            </div>
                            <div style="margin-top: 15px; font-size: 14px; color: #64748b; font-style: italic;">
                                Sau khi chuyển khoản, vui lòng bấm <b>"Xác nhận đã chuyển khoản"</b>. Nhân viên sẽ kiểm tra và xác nhận đơn của bạn.
                            </div>
                        `;
                        btn.innerText = 'Xác nhận đã chuyển khoản';
                    } else if (selectedMethod === 'Cash') {
                        instructions.innerHTML = `
                            <h4 style="color: var(--primary); margin-bottom: 15px; font-weight: 600;">Hướng dẫn thanh toán Tiền mặt</h4>
                            <p class="mb-2">Bạn có thể thanh toán trực tiếp tại văn phòng của chúng tôi hoặc yêu cầu nhân viên đến thu hộ tại nhà (chỉ áp dụng trong nội thành).</p>
                            <ul style="padding-left: 20px; color: #475569; margin-bottom: 15px; line-height: 1.6;">
                                <li><strong>Văn phòng:</strong> 123 Đường Nguyễn Huệ, Quận 1, TP.HCM</li>
                                <li><strong>Hotline thu hộ:</strong> 1900 1234</li>
                            </ul>
                            <div style="font-size: 14px; color: #64748b; font-style: italic;">
                                Bấm <b>"Xác nhận đặt phòng"</b> để chúng tôi ghi nhận yêu cầu và xếp lịch thu tiền hoặc hẹn tại văn phòng.
                            </div>
                        `;
                        btn.innerText = 'Xác nhận đặt phòng';
                    }
                };
                
                updateInstructions();
                
                // Overwrite the previous click listeners to update instructions
                document.querySelectorAll('.payment-method').forEach(el => {
                    // clone node to remove old listeners
                    const clone = el.cloneNode(true);
                    el.parentNode.replaceChild(clone, el);
                });
                
                document.querySelectorAll('.payment-method').forEach(el => {
                    el.addEventListener('click', (e) => {
                        document.querySelectorAll('.payment-method').forEach(btn => btn.classList.remove('selected'));
                        e.target.classList.add('selected');
                        selectedMethod = e.target.getAttribute('data-method');
                        updateInstructions();
                    });
                });

                document.getElementById('btnPay').addEventListener('click', async () => {
                    const btn = document.getElementById('btnPay');
                    btn.disabled = true;
                    btn.innerText = 'Đang xử lý...';

                    try {
                        // Thanh toán 1 lần duy nhất cho toàn bộ đơn hàng qua endpoint ProcessByCode
                        const payRes = await fetch(`${API_URL}/Payments/ProcessByCode`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ bookingCode: bookingCode, paymentMethod: selectedMethod })
                        });

                        const payData = await payRes.json();

                        if (payRes.ok) {
                            const txnMsg = payData.transactionCode ? ` (Mã GD: ${payData.transactionCode})` : '';
                            window.Popup.show('Thành công', (payData.message || 'Thành công!') + txnMsg, 'success');
                            setTimeout(() => window.location.href = '/history.html', 3000);
                        } else {
                            window.Popup.show('Lỗi', payData.message || 'Thanh toán thất bại', 'error');
                            btn.disabled = false;
                            updateInstructions();
                        }
                    } catch (error) {
                        window.Popup.show('Lỗi', 'Lỗi kết nối máy chủ', 'error');
                        btn.disabled = false;
                        updateInstructions();
                    }
                });

            } catch (error) {
                console.error(error);
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('auth_token');
            const nav = document.getElementById('topNav');
            if (nav) {
                if (token) {
                    nav.innerHTML += `
                        <a href="/history.html">Lịch sử</a>
                        <a href="/profile.html" style="background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 600;">👤 Tài khoản</a>
                        <a href="#" id="btnLogoutBtn" style="color: #ef4444;">Đăng xuất</a>
                    `;
                    document.getElementById('btnLogoutBtn').addEventListener('click', (e) => {
                        e.preventDefault();
                        localStorage.removeItem('auth_token');
                        window.location.reload();
                    });
                } else {
                    nav.innerHTML += `
                        <a href="/login.html" style="font-weight: 600;">Đăng nhập</a>
                        <a href="/register.html" style="background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 600;">Đăng ký</a>
                    `;
                }
            }
        });
    </script>

</body>
</html>
