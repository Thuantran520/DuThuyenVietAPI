<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/popup.css">
    <style>
        .checkout-box {
            max-width: 600px;
            margin: 0 auto;
            background: var(--white);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .price-total {
            font-size: 2.5rem;
            color: #ef4444;
            font-weight: 700;
            margin: 20px 0;
        }
        .payment-methods {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .payment-method {
            border: 2px solid var(--border);
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .payment-method.selected {
            border-color: var(--primary);
            background: var(--bg-light);
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="/index.html" class="logo">DuThuyenViet</a>
            <nav id="topNav">
                <a href="/search.html">Tìm Du Thuyền</a>
            </nav>
        </div>
    </header>

    <div class="container py-5">
        <div class="checkout-box">
            <h1 class="mb-2">Thanh Toán</h1>
            <p class="text-muted mb-4" id="checkoutBookingCode">Mã đơn: ...</p>
            
            <div id="checkoutDetails" class="text-left mb-4" style="text-align: left; background: var(--bg-light); padding: 20px; border-radius: 8px;">
                <!-- Info -->
            </div>
            
            <p>Tổng tiền cần thanh toán</p>
            <div class="price-total" id="checkoutTotal">0 ₫</div>
            
            <h3 class="mb-3 mt-4">Chọn phương thức thanh toán</h3>
            <div class="payment-methods" id="paymentMethods">
                <div class="payment-method selected" data-method="BankTransfer">Chuyển khoản NH</div>
                <div class="payment-method" data-method="CreditCard">Thẻ Tín Dụng</div>
                <div class="payment-method" data-method="Momo">Ví MoMo</div>
            </div>
            
            <button id="btnPay" class="btn-primary w-100" style="font-size: 1.2rem; padding: 15px;">Thanh Toán Ngay</button>
        </div>
    </div>

    <script src="/js/popup.js"></script>
    <script>
        const API_URL = '/api';
        const getToken = () => localStorage.getItem('auth_token');
        const formatPrice = (price) => {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
        };
        const checkAuth = () => {
            if (!getToken()) {
                window.location.href = '/login.html';
                return false;
            }
            return true;
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const token = getToken();
            if (!checkAuth()) return;

            // Checkout page logic
            const urlParams = new URLSearchParams(window.location.search);
            const bookingId = urlParams.get('bookingId');
            if (!bookingId) {
                window.location.href = '/history.html';
                return;
            }

            let selectedMethod = 'BankTransfer';

            document.querySelectorAll('.payment-method').forEach(el => {
                el.addEventListener('click', (e) => {
                    document.querySelectorAll('.payment-method').forEach(btn => btn.classList.remove('selected'));
                    e.target.classList.add('selected');
                    selectedMethod = e.target.getAttribute('data-method');
                });
            });

            try {
                const res = await fetch(`${API_URL}/Bookings/${bookingId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) {
                    window.location.href = '/history.html';
                    return;
                }

                const booking = await res.json();
                
                if (booking.status !== 'Pending') {
                    window.Popup.show('Thông báo', 'Đơn hàng này không ở trạng thái chờ thanh toán.', 'info');
                    setTimeout(() => window.location.href = '/history.html', 2000);
                    return;
                }

                document.getElementById('checkoutBookingCode').innerText = `Mã đơn: ${booking.bookingCode}`;
                document.getElementById('checkoutTotal').innerText = formatPrice(booking.totalPrice);
                
                document.getElementById('checkoutDetails').innerHTML = `
                    <p><strong>Du thuyền:</strong> ${booking.cruiseName}</p>
                    <p><strong>Loại phòng:</strong> ${booking.cabinName} (x${booking.numberOfRooms})</p>
                    <p><strong>Ngày đi:</strong> ${new Date(booking.departureDate).toLocaleDateString('vi-VN')}</p>
                    <p><strong>Khách hàng:</strong> ${booking.contactName} - ${booking.contactPhone}</p>
                `;

                document.getElementById('btnPay').addEventListener('click', async () => {
                    const btn = document.getElementById('btnPay');
                    btn.disabled = true;
                    btn.innerText = 'Đang xử lý...';

                    try {
                        const payRes = await fetch(`${API_URL}/Payments/Process`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ bookingId: parseInt(bookingId), paymentMethod: selectedMethod })
                        });

                        const payData = await payRes.json();
                        if (payRes.ok) {
                            window.Popup.show('Thành công', 'Thanh toán thành công! Mã GD: ' + payData.transactionCode, 'success');
                            setTimeout(() => window.location.href = '/history.html', 3000);
                        } else {
                            window.Popup.show('Lỗi', payData.message || 'Thanh toán thất bại', 'error');
                            btn.disabled = false;
                            btn.innerText = 'Thanh Toán Ngay';
                        }
                    } catch (error) {
                        window.Popup.show('Lỗi', 'Lỗi kết nối máy chủ', 'error');
                        btn.disabled = false;
                        btn.innerText = 'Thanh Toán Ngay';
                    }
                });

            } catch (error) {
                console.error(error);
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('auth_token');
            const nav = document.getElementById('topNav');
            if (nav) {
                if (token) {
                    nav.innerHTML += `
                        <a href="/history.html">Lịch sử</a>
                        <a href="/profile.html" style="background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 600;">👤 Tài khoản</a>
                        <a href="#" id="btnLogoutBtn" style="color: #ef4444;">Đăng xuất</a>
                    `;
                    document.getElementById('btnLogoutBtn').addEventListener('click', (e) => {
                        e.preventDefault();
                        localStorage.removeItem('auth_token');
                        window.location.reload();
                    });
                } else {
                    nav.innerHTML += `
                        <a href="/login.html" style="font-weight: 600;">Đăng nhập</a>
                        <a href="/register.html" style="background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 600;">Đăng ký</a>
                    `;
                }
            }
        });
    </script>

</body>
</html>
