<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Phòng - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .booking-form {
            background: var(--white);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
        }
        .summary-box {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .booking-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 992px) {
            .booking-layout {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 576px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="/index.html" class="logo">DuThuyenViet</a>
            <nav id="topNav">
                <a href="/search.html">Tìm Du Thuyền</a>
            </nav>
        </div>
    </header>

    <div class="container py-5">
        <h1 class="text-center mb-4">Thông Tin Đặt Phòng</h1>
        
        <div class="booking-layout">
            <div class="main-content">
                <form id="bookingForm" class="booking-form">
                    <h3 class="mb-4">Thông tin liên hệ</h3>
                    
                    <div class="form-group">
                        <label>Họ và tên người đặt *</label>
                        <input type="text" id="b_name" required>
                    </div>
                    <div class="form-group form-row">
                        <div>
                            <label>Số điện thoại *</label>
                            <input type="tel" id="b_phone" required>
                        </div>
                        <div>
                            <label>Email *</label>
                            <input type="email" id="b_email" required>
                        </div>
                    </div>
                    
                    <h3 class="mb-4 mt-4">Thông tin chuyến đi</h3>
                    <div class="form-group form-row">
                        <div>
                            <label>Số lượng phòng *</label>
                            <input type="number" id="b_rooms" min="1" max="10" value="1" required>
                        </div>
                        <div>
                            <label>Số lượng khách *</label>
                            <input type="number" id="b_guests" min="1" max="50" value="2" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Ghi chú thêm</label>
                        <textarea id="b_note" rows="3" placeholder="Yêu cầu đặc biệt (ví dụ: dị ứng thức ăn, sinh nhật...)"></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary w-100" style="font-size: 1.1rem; padding: 15px;">Xác Nhận Đặt Phòng</button>
                </form>
            </div>
            
            <div class="sidebar">
                <div class="summary-box sticky-top" style="position: sticky; top: 100px;">
                    <h3 class="mb-4">Tóm tắt đơn hàng</h3>
                    <div id="bookingSummary">
                        <p>Đang tải thông tin...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/popup.js"></script>
    <script>
        const API_URL = '/api';
        const getToken = () => localStorage.getItem('auth_token');
        const formatPrice = (price) => {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
        };
        const checkAuth = () => {
            if (!getToken()) {
                window.location.href = '/login.html';
                return false;
            }
            return true;
        };

        document.addEventListener('DOMContentLoaded', async () => {
            // Header logic
            const token = getToken();
            const nav = document.getElementById('topNav');
            if (token) {
                nav.innerHTML += `
                    <a href="/history.html">Lịch sử đặt vé</a>
                    <a href="/profile.html">Cá nhân</a>
                    <a href="#" id="btnLogoutBtn">Đăng xuất</a>
                `;
                document.getElementById('btnLogoutBtn').addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('auth_token');
                    window.location.href = '/login.html';
                });
            } else {
                nav.innerHTML += `
                    <a href="/login.html">Đăng nhập</a>
                    <a href="/register.html">Đăng ký</a>
                `;
            }

            if (!checkAuth()) return;

            // Booking page logic
            const urlParams = new URLSearchParams(window.location.search);
            const scheduleId = urlParams.get('scheduleId');
            const cruiseId = urlParams.get('cruiseId');
            const cabinsParam = urlParams.get('cabins');
            const singleCabinId = urlParams.get('cabinTypeId');
            
            let selectedCabins = [];
            if (cabinsParam) {
                selectedCabins = cabinsParam.split(',').map(c => {
                    const parts = c.split(':');
                    return { cabinTypeId: parseInt(parts[0]), count: parseInt(parts[1]) };
                });
            } else if (singleCabinId) {
                selectedCabins = [{ cabinTypeId: parseInt(singleCabinId), count: 1 }];
            }

            if (!scheduleId || selectedCabins.length === 0) {
                window.Popup.show('Lỗi', 'Thông tin không hợp lệ.', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/Cruises/${cruiseId}`);
                const cruise = await response.json();
                const schedule = cruise.schedules.find(s => s.scheduleId == scheduleId);
                
                if (!schedule) throw new Error('Data mismatch');

                const updateSummary = () => {
                    let totalAmount = 0;
                    let summaryHtml = `
                        <h4 class="mb-2">${cruise.name}</h4>
                        <p><strong>Khởi hành:</strong> ${new Date(schedule.departureDate).toLocaleDateString('vi-VN')}</p>
                        <p><strong>Thời gian:</strong> ${schedule.durationLabel}</p>
                        <hr class="my-3">
                    `;
                    
                    // If single cabin mode and no cabinsParam, take count from input
                    if (singleCabinId && !cabinsParam) {
                        selectedCabins[0].count = parseInt(document.getElementById('b_rooms').value) || 1;
                    }

                    selectedCabins.forEach(sc => {
                        const cabin = cruise.cabins.find(c => c.cabinTypeId == sc.cabinTypeId);
                        if (cabin) {
                            const lineTotal = cabin.basePrice * sc.count;
                            totalAmount += lineTotal;
                            summaryHtml += `
                                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                    <span><strong>${cabin.name}</strong> (x${sc.count})</span>
                                    <span>${formatPrice(lineTotal)}</span>
                                </div>
                            `;
                        }
                    });
                    
                    summaryHtml += `
                        <hr class="my-3">
                        <h4 class="mt-3">Tổng cộng: <span class="text-danger">${formatPrice(totalAmount)}</span></h4>
                    `;
                    
                    document.getElementById('bookingSummary').innerHTML = summaryHtml;
                };

                updateSummary();
                if (singleCabinId && !cabinsParam) {
                    document.getElementById('b_rooms').addEventListener('input', updateSummary);
                } else {
                    document.getElementById('b_rooms').closest('div').style.display = 'none';
                }

            } catch (e) {
                document.getElementById('bookingSummary').innerHTML = '<p class="text-danger">Không thể tải thông tin chuyến đi.</p>';
            }

            document.getElementById('bookingForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const contactName = document.getElementById('b_name').value;
                const contactPhone = document.getElementById('b_phone').value;
                const contactEmail = document.getElementById('b_email').value;
                const note = document.getElementById('b_note').value;
                const numberOfGuests = parseInt(document.getElementById('b_guests').value);

                // Re-read rooms for single mode
                if (singleCabinId && !cabinsParam) {
                    selectedCabins[0].count = parseInt(document.getElementById('b_rooms').value) || 1;
                }

                try {
                    let firstBookingId = null;
                    let hasError = false;
                    for (let i = 0; i < selectedCabins.length; i++) {
                        const sc = selectedCabins[i];
                        const payload = {
                            scheduleId: parseInt(scheduleId),
                            cabinTypeId: sc.cabinTypeId,
                            numberOfRooms: sc.count,
                            numberOfGuests: i === 0 ? numberOfGuests : 1, // Allocate guests to first booking
                            contactName,
                            contactPhone,
                            contactEmail,
                            note
                        };

                        const res = await fetch(`${API_URL}/Bookings`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json();
                        if (res.ok) {
                            if (!firstBookingId) firstBookingId = data.bookingId;
                        } else {
                            window.Popup.show('Lỗi', data.message || 'Lỗi đặt phòng', 'error');
                            hasError = true;
                            break;
                        }
                    }
                    
                    if (!hasError) {
                        if (selectedCabins.length === 1 && firstBookingId) {
                            window.location.href = `/checkout.html?bookingId=${firstBookingId}`;
                        } else {
                            window.Popup.show('Thành công', 'Đã tạo các đơn đặt phòng thành công.', 'success');
                            setTimeout(() => window.location.href = `/history.html`, 1500);
                        }
                    }
                } catch (error) {
                    window.Popup.show('Lỗi', 'Không thể kết nối máy chủ.', 'error');
                }
            });
        });
    </script>
</body>
</html>
