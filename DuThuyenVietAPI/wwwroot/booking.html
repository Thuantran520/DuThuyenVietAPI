<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Phòng - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/popup.css">
    <link rel="stylesheet" href="/css/booking.css">
</head>
<body>
    <header class="main-header"></header>

    <div class="breadcrumbs-container">
        <div class="container">
            <ul class="breadcrumbs">
                <li><a href="/index.html">Trang chủ</a></li>
                <li id="breadcrumb-search-item"><a href="/search.html">Du thuyền</a></li>
                <li><a href="#" id="bc-cruise-link">Chi tiết du thuyền</a></li>
                <li class="active" id="bc-cruise-active">Đặt phòng</li>
            </ul>
        </div>
    </div>

    <div class="container py-5">
        <h1 class="text-center mb-4">Thông Tin Đặt Phòng</h1>

        <div class="booking-layout">
            <div class="main-content">
                <form id="bookingForm" class="booking-form">
                    <h3 class="mb-4">Thông tin liên hệ</h3>

                    <div class="form-group">
                        <label>Họ và tên người đặt *</label>
                        <input type="text" id="b_name" required>
                    </div>
                    <div class="form-group form-row">
                        <div>
                            <label>Số điện thoại *</label>
                            <input type="tel" id="b_phone" required>
                        </div>
                        <div>
                            <label>Email *</label>
                            <input type="email" id="b_email" required>
                        </div>
                    </div>

                    <h3 class="mb-4 mt-4">Thông tin chuyến đi</h3>
                    <!-- Mặc định ẩn để JS quyết định layout, tránh hiện tượng flash -->
                    <div class="form-group" id="trip-info-row" style="display: none;">
                        <div id="room-count-wrapper">
                            <label>Số lượng phòng *</label>
                            <input type="number" id="b_rooms" min="1" max="10" value="1" required>
                        </div>
                        <div id="guest-count-wrapper">
                            <label>Số lượng khách *</label>
                            <input type="number" id="b_guests" min="1" max="50" value="2" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Ghi chú thêm</label>
                        <textarea id="b_note" rows="3" placeholder="Yêu cầu đặc biệt (ví dụ: dị ứng thức ăn, sinh nhật...)"></textarea>
                    </div>

                    <button type="submit" class="btn-primary w-100" style="font-size: 1.1rem; padding: 15px;">Xác Nhận Đặt Phòng</button>
                </form>
            </div>

            <div class="sidebar">
                <div class="summary-box sticky-top" style="position: sticky; top: 100px;">
                    <h3 class="mb-4">Tóm tắt đơn hàng</h3>
                    <div id="bookingSummary">
                        <p>Đang tải thông tin...</p>
                    </div>

                    <!-- KHUNG NHẬP MÃ GIẢM GIÁ -->
                    <div class="promo-box my-3" style="border-top: 1px dashed #cbd5e1; padding-top: 15px; margin-top: 15px;">
                        <label style="font-weight: 600; font-size: 0.9rem;">Mã giảm giá / Voucher</label>
                        <div style="display: flex; gap: 8px; margin-top: 5px;">
                            <input type="text" id="promoCodeInput" placeholder="Ví dụ: SUMMER2026" style="text-transform: uppercase; flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                            <button type="button" id="btnApplyPromo" class="btn-secondary" style="padding: 8px 15px; border-radius: 6px;">Áp dụng</button>
                        </div>
                        <div id="promoMessage" style="font-size: 0.85rem; margin-top: 6px; font-weight: 500;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="main-footer"></footer>

    <script src="/js/popup.js"></script>
    <!-- Đã thêm ?v=2 để tự động xóa bộ nhớ đệm JS cũ của trình duyệt -->
    <script src="/js/booking-page.js?v=2"></script>
    <script src="/js/navigation.js"></script>
</body>
</html>
