<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Phòng - Du Thuyền Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .booking-form {
            background: var(--white);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
        }
        .summary-box {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="/index.html" class="logo">DuThuyenViet</a>
            <nav>
                <a href="/search.html">Tìm Du Thuyền</a>
                <a href="/history.html">Lịch sử đặt vé</a>
                <a href="/profile.html">Cá nhân</a>
            </nav>
        </div>
    </header>

    <div class="container py-5">
        <h1 class="text-center mb-4">Thông Tin Đặt Phòng</h1>
        
        <div class="booking-layout">
            <div class="main-content">
                <form id="bookingForm" class="booking-form">
                    <h3 class="mb-4">Thông tin liên hệ</h3>
                    
                    <div class="form-group">
                        <label>Họ và tên người đặt *</label>
                        <input type="text" id="b_name" required>
                    </div>
                    <div class="form-group form-row">
                        <div>
                            <label>Số điện thoại *</label>
                            <input type="tel" id="b_phone" required>
                        </div>
                        <div>
                            <label>Email *</label>
                            <input type="email" id="b_email" required>
                        </div>
                    </div>
                    
                    <h3 class="mb-4 mt-4">Thông tin chuyến đi</h3>
                    <div class="form-group form-row">
                        <div>
                            <label>Số lượng phòng *</label>
                            <input type="number" id="b_rooms" min="1" max="10" value="1" required>
                        </div>
                        <div>
                            <label>Số lượng khách *</label>
                            <input type="number" id="b_guests" min="1" max="50" value="2" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Ghi chú thêm</label>
                        <textarea id="b_note" rows="3" placeholder="Yêu cầu đặc biệt (ví dụ: dị ứng thức ăn, sinh nhật...)"></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary w-100" style="font-size: 1.1rem; padding: 15px;">Xác Nhận Đặt Phòng</button>
                </form>
            </div>
            
            <div class="sidebar">
                <div class="summary-box sticky-top" style="position: sticky; top: 100px;">
                    <h3 class="mb-4">Tóm tắt đơn hàng</h3>
                    <div id="bookingSummary">
                        <p>Đang tải thông tin...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/popup.js"></script>
    <script src="/js/booking.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initBookingPage();
        });
    </script>
</body>
</html>
